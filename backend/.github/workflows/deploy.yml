name: Deploy Spring Boot API

on:
  push:
    branches:
      - main

concurrency:
  group: backend-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build Spring Boot JAR
        run: ./mvnw clean package -DskipTests

      - name: Verify built JAR
        run: |
          set -e

          echo "========================================"
          echo "JAR INFORMATION"
          echo "========================================"

          ls -lh target/

          test -f target/backend-api-0.0.1-SNAPSHOT.jar

          echo ""
          echo "========================================"
          echo "APPLICATION CLASSES"
          echo "========================================"

          jar tf target/backend-api-0.0.1-SNAPSHOT.jar | grep "com/itsdeligh/platform"

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          source: target/backend-api-0.0.1-SNAPSHOT.jar
          target: /opt/apps/backend-api/target/
          strip_components: 1
          overwrite: true

      - name: Verify JAR on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "JAR ON VPS"
            echo "========================================"

            ls -lh /opt/apps/backend-api/target/backend-api-0.0.1-SNAPSHOT.jar

            echo ""
            echo "========================================"
            echo "JAR CONTENT"
            echo "========================================"

            jar tf /opt/apps/backend-api/target/backend-api-0.0.1-SNAPSHOT.jar | grep "com/itsdeligh/platform"

      - name: Restart Backend API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "RESTARTING BACKEND API"
            echo "========================================"

            sudo systemctl restart backend-api

            echo ""
            echo "========================================"
            echo "WAITING FOR APPLICATION"
            echo "========================================"

            healthy=false

            for i in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8081/actuator/health > /tmp/health.json; then
                healthy=true
                break
              fi

              echo "Application not ready yet... attempt $i/30"
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              echo "Application did not become healthy."

              echo ""
              echo "========================================"
              echo "SYSTEMD STATUS"
              echo "========================================"

              sudo systemctl status backend-api --no-pager || true

              echo ""
              echo "========================================"
              echo "APPLICATION LOGS"
              echo "========================================"

              sudo journalctl -u backend-api -n 100 --no-pager || true

              exit 1
            fi

            echo ""
            echo "========================================"
            echo "APPLICATION HEALTH"
            echo "========================================"

            cat /tmp/health.json

            echo ""
            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "========================================"

      - name: Test API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "TESTING API"
            echo "========================================"

            curl --fail -i http://127.0.0.1:8081/api/ping