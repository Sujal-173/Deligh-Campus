services:
  - type: web
    name: deligh-campus-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "8081"
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deligh-campus-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: deligh-campus-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: deligh-campus-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: deligh-campus-db
    databaseName: deligh_campus
    user: deligh_campus
    plan: free
